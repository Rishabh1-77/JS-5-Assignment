  <body>
    <h1>Task 2</h1>
    <br />
    <hr />
    <h3>Addition Of Two Numbers</h3>
    <label>--</label>
    <input type="number" placeholder="Enter 1st Number" id="in1" />
    <br /><br />
    <label>--</label>
    <input type="number" placeholder="Enter 2st Number" id="in2" />
    <br /><br />
    <button id="btn" onclick="addNumber()">
      Add
    </button>
    <!--JS-->
    <script>
        function addNumber(){
      let a = Number(document.getElementById("in1").value);
      let b = Number(document.getElementById("in2").value);
            alert("Addition of Two Number is: " + (a+b));
        }
    </script>
  </body>
